# The one CI environment setup for this repository: .NET (pinned by global.json) and the wasm-tools
# workload.
#
# Packages need no step here. global.json pins a Cohesion build and a Viu build (each a CI or
# release version), and NuGet.config restores both from the Assimalign GitHub Packages feed with the
# credential the calling job supplies as NuGetPackageSourceCredentials_assimalign.
name: Set up Viu Platforms CI
description: .NET and the wasm-tools workload.

runs:
  using: composite
  steps:
    - name: Install .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json

    - name: Install WebAssembly workload
      shell: pwsh
      run: dotnet workload install wasm-tools
