# Continuous validation for the Cohesion platform area. Mirrors the sibling repositories'
# per-area workflow model (assimalign/cohesion resource-web.yml): every push that touches the
# area builds and tests the whole platform solution.
#
# Cohesion restores from the Assimalign GitHub Packages feed at the build global.json pins (a
# cohesion ci-packages.yml build or a release). These packages are public, so the workflow token
# with packages: read is the credential; NuGet reads it from NuGetPackageSourceCredentials_assimalign
# and nothing is written to a config file. Viu still restores from a sibling pack at
# VIU_SIBLING_REF; see .github/actions/setup.
name: Platform - Cohesion

on:
  push:
    paths:
      - 'platforms/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Assimalign.Viu.Platforms.slnx'
      - 'NuGet.config'
      - 'scripts/**'
      - 'global.json'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/platform-cohesion.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      NuGetPackageSourceCredentials_assimalign: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI
        uses: ./.github/actions/setup
        with:
          viu-sibling-ref: ${{ vars.VIU_SIBLING_REF }}

      - name: Test CI package version and prune policy
        shell: pwsh
        run: ./scripts/tests/Test-CiPackages.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore Assimalign.Viu.Platforms.slnx

      - name: Build
        shell: pwsh
        run: dotnet build Assimalign.Viu.Platforms.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test Assimalign.Viu.Platforms.slnx --configuration Release --no-build
