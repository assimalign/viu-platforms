# Keeps the GitHub Packages feed that .github/workflows/ci-packages.yml fills usable.
#
# ci-packages.yml publishes the full release set, 8 package versions, for every push to main and
# every commit to an open same-repository pull request. This workflow deletes two kinds of them and
# nothing else:
#
#   * every <base>.pr.<N>.<build> version of a pull request the GitHub API reports closed, merged
#     or not; N is compared as a number, so closing #15 never touches #152; and
#   * every main build (<base>.ci.<build>) outside the newest 20 of its base.
#
# Selection is Select-ViuPlatformsCiPackageVersionToPrune in
# scripts/modules/ViuPlatformsPackaging.psm1, which only ever returns those exact CI shapes, so a
# release version (10.0.0-preview.1) or stable version is never selected. The packages examined are
# the release inventory's (Get-ViuPlatformsReleasePackageId), because GITHUB_TOKEN cannot list an
# organization's packages; Cohesion's own Assimalign.Cohesion.* packages are never in that set.
# Retention policy and its numbers: README.md, "CI packages".
#
# Every run recomputes the whole selection from the feed, so one run per trigger is enough and a
# run that stops early leaves nothing to carry over:
#
#   * pull_request_target (closed) deletes a pull request's builds as soon as it closes;
#   * the hourly schedule trims main builds and catches closes this trigger skips (Dependabot,
#     forks) or that a queued run lost; and
#   * workflow_dispatch defaults to a dry run that lists what would be deleted.
#
# pull_request_target, not pull_request, because it runs this file and the pruning module from the
# default branch: the code that decides what to delete is reviewed code, never the closing pull
# request's own. No step checks out or runs pull request code, and nothing from the event payload
# reaches a script; the payload is read only by the job condition below. ci-packages.yml itself must
# stay off pull_request_target, because it does build the code under review.
#
# Every `uses:` is pinned to a commit SHA with a trailing version comment.
name: CI Packages Prune

on:
  pull_request_target:
    branches: [main]
    types: [closed]
    # The same filter as ci-packages.yml: a pull request that changes only these never published,
    # so its close is not worth a scan.
    paths-ignore:
      - '.claude/**'
      - 'README.md'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List what would be deleted without deleting anything'
        type: boolean
        default: true

permissions:
  contents: read

# One prune at a time: two runs would race on the same versions and split the rate limit. A queued
# run replaced by a newer one loses nothing, because each run prunes everything.
concurrency:
  group: viu-platforms-ci-packages-prune
  cancel-in-progress: false

jobs:
  prune:
    name: prune CI package versions
    # Fork pull requests never publish, so their close has nothing to delete. A Dependabot-triggered
    # event gets a read-only token, so its deletes would fail; the hourly run removes those builds.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    # A run lists 8 packages and deletes at most a few builds' worth, a second apart. The module
    # stops starting requests after 45 minutes; 60 bounds a run that a secondary rate limit slows.
    timeout-minutes: 60
    permissions:
      contents: read
      # The deletes. The repository holds the Admin role on every package its workflows published,
      # which GitHub requires for deleting through GITHUB_TOKEN.
      packages: write
      # Pull request state decides which pr builds are closed.
      pull-requests: read
    steps:
      # The default branch's tooling: pull_request_target and schedule both check out the default
      # branch, and no ref is given, so pull request code is never checked out here.
      - name: Checkout pruning tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/modules

      - name: Prune CI package versions
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          VIU_PLATFORMS_PACKAGE_OWNER: ${{ github.repository_owner }}
          VIU_PLATFORMS_REPOSITORY: ${{ github.repository }}
          VIU_PLATFORMS_PRUNE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          Import-Module ./scripts/modules/ViuPlatformsPackaging.psm1 -Force
          Import-Module ./scripts/modules/ViuPlatformsPackageFeed.psm1 -Force

          $arguments = @{
            Organization   = $env:VIU_PLATFORMS_PACKAGE_OWNER
            Repository     = $env:VIU_PLATFORMS_REPOSITORY
            PackageName    = Get-ViuPlatformsReleasePackageId
            Token          = $env:GITHUB_PACKAGES_TOKEN
            # The newest 20 main builds of each base stay; see README.md, "CI packages".
            MainBuildCount = 20
            SummaryPath    = $env:GITHUB_STEP_SUMMARY
            WhatIf         = $env:VIU_PLATFORMS_PRUNE_DRY_RUN -eq 'true'
          }

          $summary = Invoke-ViuPlatformsCiPackagePrune @arguments
          Write-Host ("Selected {0}, deleted {1}, deferred {2}, {3} API requests." -f
            $summary.Selected,
            $summary.Deleted,
            $summary.Deferred,
            $summary.Requests)
